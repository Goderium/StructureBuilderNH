plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}
group = providers.gradleProperty('modGroup').get()
apply from: 'gradle/build-version.gradle'
java { toolchain { languageVersion = JavaLanguageVersion.of(8) } }
minecraft {
    mcVersion = providers.gradleProperty('minecraftVersion').get()
    javaCompatibilityVersion = 8
    jvmLanguageVersion = JavaLanguageVersion.of(8)
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '12'
    useForgeEmbeddedMappings = false
    injectMissingGenerics = false
    injectedTags.put('VERSION', project.version.toString())
}
apply from: 'repositories.gradle'
apply from: 'dependencies.gradle'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-proc:none'] }
tasks.injectTags { outputClassName.set("${project.group}.Tags") }
tasks.processResources {
    inputs.property('version', project.version.toString())
    filesMatching('mcmod.info') { expand(version: project.version) }
}
tasks.jar {
    from('LICENSE') { into 'META-INF' }
    manifest.attributes('FMLCorePlugin': 'com.Goderium.StructureBuilderNH.loader.EarlyLoader',
        'FMLCorePluginContainsFMLMod': 'true', 'ForceLoadAsMod': 'true')
}

tasks.register('writeBuildMetadata', WriteProperties) {
    destinationFile = layout.buildDirectory.file('build-metadata.properties')
    encoding = 'UTF-8'
    property('version', project.version.toString())
    property('jar_name', tasks.named('reobfJar').flatMap { it.archiveFileName })
}
