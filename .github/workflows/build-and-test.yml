name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Version embedded in the built mod
        value: ${{ jobs.build.outputs.version }}
      jar_name:
        description: Filename of the installable JAR
        value: ${{ jobs.build.outputs.jar_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.build.outputs.version }}
      jar_name: ${{ steps.build.outputs.jar_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Build
        id: build
        shell: bash
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            args+=("-PreleaseTag=$GITHUB_REF_NAME")
          else
            args+=("-PbuildBranch=${PR_BRANCH:-$GITHUB_REF_NAME}")
          fi
          bash gradlew --no-daemon --console=plain "${args[@]}" build writeBuildMetadata
          cat build/build-metadata.properties >> "$GITHUB_OUTPUT"

      - name: Upload JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-jar
          path: build/libs/${{ steps.build.outputs.jar_name }}
          if-no-files-found: error
          retention-days: 14
