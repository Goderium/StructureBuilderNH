def pack = project.elytraModpackVersion
pack.setGtnhVersion('2.9.0')
// Elytra v1.1.2 uses this flag to allow reuse of the downloaded release manifest.
pack.setManifestNoCache(true)

dependencies {
    // CoFH Core uses a CurseForge file ID; IC2 publishes its dev JAR under a different version scheme.
    compileOnly(rfg.deobf('curse.maven:cofh-core-69162:2388751')) { transitive = false }
    compileOnly('net.industrial-craft:industrialcraft-2:2.2.828-experimental:dev') { transitive = false }
    compileOnly(pack.gtnhdev('GT5-Unofficial')) { transitive = false }
    compileOnly(pack.gtnhdev('Galacticraft')) { transitive = false }
    compileOnly(pack.gtnhdev('Applied-Energistics-2-Unofficial')) { transitive = false }
    compileOnly(pack.gtnhdev('Chisel')) { transitive = false }
    compileOnly(pack.gtnhdev('StructureLib')) { transitive = false }
    compileOnly(pack.gtnhdev('BlockRenderer6343')) { transitive = false }
    compileOnly('it.unimi.dsi:fastutil:8.5.18') { transitive = false }
    compileOnly(pack.gtnhdev('GTNHLib')) { transitive = false }
    compileOnly(pack.gtnhdev('ModularUI')) { transitive = false }
    compileOnly(pack.gtnhdev('ModularUI2')) { transitive = false }
    compileOnly("io.github.legacymoddingmc:unimixins:${pack['UniMixins']}:dev") { transitive = false }
}
